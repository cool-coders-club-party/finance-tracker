name: Poca CI

on:
  pull_request:
    branches: [main, deploy/poca-demo]
  push:
    branches: [main, deploy/poca-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  transactions:
    name: Transactions tests and build (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/services/transactions-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/services/transactions-service/*.gradle
            backend/services/transactions-service/gradle/wrapper/gradle-wrapper.properties
      # Testcontainers starts isolated PostgreSQL; no shared development database is used.
      - name: Check Docker availability
        run: docker info
      - name: Run all tests and package Transactions
        run: sh ./gradlew --no-daemon build
      - name: Upload Transactions test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transactions-test-reports
          path: |
            backend/services/transactions-service/build/reports/tests/
            backend/services/transactions-service/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  maven:
    name: Maven — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - users-service
          - portfolio-service
          - market-data-service
          - insights-service
          - reporting-service
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/services/${{ matrix.service }}/pom.xml
      - name: Run service tests and package
        run: sh ./mvnw --batch-mode --no-transfer-progress -pl services/${{ matrix.service }} -am verify
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            backend/services/${{ matrix.service }}/target/surefire-reports/
            backend/services/${{ matrix.service }}/target/failsafe-reports/
          # Some services do not yet have tests; verify still compiles and packages them.
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Build demo Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, transactions, maven]
    env:
      # Only used to resolve Compose configuration; images are not started or deployed.
      POCA_JWT_SECRET: ci-only-placeholder-for-compose-build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose -f compose.yml -f compose.demo.yml config --quiet
      - name: Build backend images
        run: docker compose -f compose.yml -f compose.demo.yml build
