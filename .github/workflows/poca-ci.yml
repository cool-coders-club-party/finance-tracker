name: Poca CI

on:
  pull_request:
    branches: [deploy/poca-demo]
  push:
    branches: [deploy/poca-demo]

permissions:
  contents: read

jobs:
  build:
    name: Build and test Poca
    runs-on: ubuntu-latest
    env:
      POCA_JWT_SECRET: ci-only-placeholder-for-compose-build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Build backend images
        run: docker compose -f compose.yml -f compose.demo.yml build
