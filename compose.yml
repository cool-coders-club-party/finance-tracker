networks:
  finance-tracker:
    driver: bridge

volumes:
  transaction-db-data:
    driver: local
  users-db-data:
    driver: local
  portfolio-db-data:
    driver: local

services:
  transaction-postgres:
    image: 'postgres:17.5-alpine'
    container_name: transaction-postgres
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions
    volumes:
      - transaction-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 20

  transaction-redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  users-postgres:
    image: postgres:17.5-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "finance", "-d", "users" ]
      interval: 10s
      timeout: 5s
      retries: 20

  portfolio-db:
    image: postgres:17.5-alpine
    container_name: portfolio-db
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev
    ports:
      - "5436:5432"
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U portfolio -d portfolio" ]
      interval: 10s
      timeout: 5s
      retries: 20