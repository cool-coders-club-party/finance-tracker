spring:
  application:
    name: market-data-service
  profiles:
    active: stub
  datasource:
    url: jdbc:h2:mem:marketdata;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8084
market-data:
  cache:
    freshness: 15m
management:
  endpoints:
    web:
      exposure:
        include: health,info
