spring:
  application:
    name: users-service
  datasource:
    #url: jdbc:h2:mem:users;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    url: jdbc:postgresql://localhost:5432/users
    username: finance
    password: finance
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum}
    expiry-minutes: 15