spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:h2:mem:reporting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8086
jwt:
  secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
reporting:
  clients:
    transactions-base-url: http://localhost:8082
    portfolio-base-url: http://localhost:8083
